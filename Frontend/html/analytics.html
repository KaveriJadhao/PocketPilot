<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Analytics - PocketPilot</title>

  <link rel="stylesheet" href="../css/analytics.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
</head>
<body>

  <div class="sidebar">
    <div class="logo"><i class="fa-solid fa-wallet"></i> PocketPilot</div>

    <ul class="menu">
      <li><a href="dashboard.html"><i class="fa-solid fa-house"></i> Dashboard</a></li>
      <li class="active"><a href="analytics.html"><i class="fa-solid fa-chart-line"></i> Analytics</a></li>
      <li><a href="voice.html"><i class="fa-solid fa-microphone"></i> Voice AI</a></li>
      <li><a href="rewards.html"><i class="fa-solid fa-gift"></i> Rewards</a></li>
      <li><a href="mood.html"><i class="fa-solid fa-face-smile"></i> Mood Tracker</a></li>
      <li><a href="settings.html"><i class="fa-solid fa-gear"></i> Settings</a></li>
    </ul>
  </div>

  <div class="main-content">
    <div class="topbar">
      <div>
        <h1>Analytics 📊</h1>
        <p>Understand where your money goes.</p>
      </div>

      <a href="dashboard.html" class="back-btn">Back to Dashboard</a>
    </div>

    <div class="cards">
      <div class="card">
        <h3>Total Spending</h3>
        <h2 id="totalSpending">₹0</h2>
      </div>

      <div class="card">
        <h3>Food Spending</h3>
        <h2 id="foodSpending">₹0</h2>
      </div>

      <div class="card">
        <h3>Travel Spending</h3>
        <h2 id="travelSpending">₹0</h2>
      </div>

      <div class="card">
        <h3>Highest Category</h3>
        <h2 id="highestCategory">-</h2>
      </div>
    </div>

    <div class="charts-grid">
      <div class="chart-card">
        <h2>Category Breakdown</h2>
        <canvas id="categoryChart"></canvas>
      </div>

      <div class="chart-card">
        <h2>Weekly Spending Trend</h2>
        <canvas id="weeklyChart"></canvas>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="../js/analytics.js"></script>
</body>
</html>
